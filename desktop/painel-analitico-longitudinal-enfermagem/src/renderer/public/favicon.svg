<!--
  Marca do Painel Analítico Longitudinal.

  A cruz vem da identidade aprovada nos mockups (Login.pdf e topbar), onde
  aparece em branco sobre o petróleo institucional. Aqui ela é invertida para
  funcionar como ícone de aplicativo: fundo petróleo, cruz branca.

  O desenho é deliberadamente simples porque precisa sobreviver a 16 px na
  barra de tarefas. A camada analítica — as barras ascendentes — fica para a
  splash, onde há tamanho para lê-la.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Painel Analítico">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F666E" />
      <stop offset="1" stop-color="#1D3E44" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#fundo)" />

  <g fill="#FFFFFF">
    <rect x="26.5" y="12" width="11" height="40" rx="3.5" />
    <rect x="12" y="26.5" width="40" height="11" rx="3.5" />
  </g>
</svg>
